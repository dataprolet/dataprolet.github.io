<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortable Markdown table</title>
  <!-- Marked.js zum Parsen von Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #24292f;
      --border-color: #d0d7de;
      --header-bg: #f6f8fa;
      --hover-bg: #f3f4f6;
      --accent-color: #0969da;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0d1117;
        --text-color: #c9d1d9;
        --border-color: #30363d;
        --header-bg: #161b22;
        --hover-bg: #21262d;
        --accent-color: #58a6ff;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.95rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 0.6rem 0.9rem;
      text-align: left;
    }

    th {
      background-color: var(--header-bg);
      cursor: pointer;
      user-select: none;
      position: relative;
      padding-right: 1.8rem;
    }

    th:hover {
      background-color: var(--hover-bg);
    }

    /* Sortier-Pfeile */
    th::after {
      content: "↕";
      position: absolute;
      right: 0.6rem;
      opacity: 0.4;
      font-size: 0.85em;
    }

    th.sort-asc::after {
      content: "▲";
      opacity: 1;
      color: var(--accent-color);
    }

    th.sort-desc::after {
      content: "▼";
      opacity: 1;
      color: var(--accent-color);
    }

    tr:nth-child(even) {
      background-color: rgba(128, 128, 128, 0.04);
    }

    tr:hover {
      background-color: var(--hover-bg);
    }

    .error {
      color: #cf222e;
      padding: 1rem;
      border: 1px solid #cf222e;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div id="content">Loading table...</div>

  <script>
    const MARKDOWN_FILE = 'table.md';

    async function loadAndRenderMarkdown() {
      const container = document.getElementById('content');
      try {
        const response = await fetch(MARKDOWN_FILE);
        if (!response.ok) {
          throw new Error(`Datei "${MARKDOWN_FILE}" konnte nicht geladen werden (HTTP ${response.status}).`);
        }
        const markdownText = await response.text();
        
        // Convert Markdown to HTML
        container.innerHTML = marked.parse(markdownText);

        // Make all tables sortable
        container.querySelectorAll('table').forEach(makeTableSortable);
      } catch (err) {
        container.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
      }
    }

    function makeTableSortable(table) {
      const headers = table.querySelectorAll('th');
      const tbody = table.querySelector('tbody');
      if (!tbody) return;

      headers.forEach((header, colIndex) => {
        let asc = true;

        header.addEventListener('click', () => {
          const rows = Array.from(tbody.querySelectorAll('tr'));

          // Reset visual indicator
          headers.forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
          header.classList.add(asc ? 'sort-asc' : 'sort-desc');

          rows.sort((rowA, rowB) => {
            const cellA = rowA.children[colIndex]?.innerText.trim() || '';
            const cellB = rowB.children[colIndex]?.innerText.trim() || '';

            // Check if values are numbers
            const numA = parseFloat(cellA.replace(/\./g, '').replace(',', '.'));
            const numB = parseFloat(cellB.replace(/\./g, '').replace(',', '.'));

            if (!isNaN(numA) && !isNaN(numB) && /^[0-9.,\s-]+$/.test(cellA) && /^[0-9.,\s-]+$/.test(cellB)) {
              return asc ? numA - numB : numB - numA;
            }

            // Sort alphabetically
            return asc
              ? cellA.localeCompare(cellB, 'de', { numeric: true, sensitivity: 'base' })
              : cellB.localeCompare(cellA, 'de', { numeric: true, sensitivity: 'base' });
          });

          // Insert sorted lines
          rows.forEach(row => tbody.appendChild(row));
          asc = !asc;
        });
      });
    }

    loadAndRenderMarkdown();
  </script>
</body>
</html>
