<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drück mich nicht!</title>
  <style>
    body {
      font-family: Comic Sans MS, cursive;
      background-color: #ffe;
      text-align: center;
      margin-top: 100px;
    }
    h1 {
      color: #d00;
    }
    #funButton {
      padding: 20px 40px;
      font-size: 20px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: absolute;
    }
    #message {
      margin-top: 50px;
      font-size: 24px;
      color: green;
    }
  </style>
</head>
<body>
  <h1>Drück NICHT den roten Knopf!</h1>
  <button id="funButton">Nicht drücken!</button>
  <div id="message"></div>

  <script>
    const button = document.getElementById("funButton");
    const message = document.getElementById("message");
    const funnyMessages = [
      "Ich hab's dir gesagt!",
      "Jetzt hast du's kaputt gemacht.",
      "Oops... das wird teuer.",
      "Warum hörst du nie auf Warnungen?",
      "Zu spät! Die Aliens kommen.",
      "Ein Lama wurde gerade teleportiert.",
      "404 Fehler: Verantwortung nicht gefunden.",
    ];

    // Lässt den Button "fliehen", wenn man mit der Maus drüber fährt
    button.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 200);
      const y = Math.random() * (window.innerHeight - 100);
      button.style.left = `${x}px`;
      button.style.top = `${y}px`;
    });

    // Zeigt eine witzige Nachricht an
    button.addEventListener("click", () => {
      const randomMessage = funnyMessages[Math.floor(Math.random() * funnyMessages.length)];
      message.textContent = randomMessage;
    });

    // Anfangsposition des Buttons setzen
    window.onload = () => {
      button.style.left = "50%";
      button.style.top = "50%";
      button.style.transform = "translate(-50%, -50%)";
    };
  </script>
</body>
</html>
